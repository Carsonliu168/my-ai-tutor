<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>登入系統｜數學小老師安安</title>
  <style>
    body {
      font-family: "Microsoft JhengHei", Arial, sans-serif;
      background: linear-gradient(135deg, #e0f0ff, #f6fbff);
      height: 100vh; margin: 0; display: flex; justify-content: center; align-items: center;
    }
    .login-box { background: white; padding: 40px; border-radius: 20px; box-shadow: 0 0 25px rgba(0,0,0,0.1); width: 320px; text-align: center; }
    h1 { color: #0078d7; margin-bottom: 20px; }
    input[type=text], input[type=password] { width: 90%; padding: 10px; margin: 8px 0; border: 1px solid #ccc; border-radius: 8px; font-size: 15px; }
    button { width: 95%; padding: 10px; background-color: #0078d7; color: white; border: none; border-radius: 8px; font-size: 16px; cursor: pointer; margin-top: 10px; }
    button:hover { background-color: #005fa3; }
    .error { color: red; margin-bottom: 10px; }
    .footer { margin-top: 15px; font-size: 13px; color: #666; }
  </style>
</head>
<body>
  <div class="login-box">
    <h1>🧮 安安登入系統</h1>

    {% if error %}
      <div class="error">{{ error }}</div>
    {% endif %}

    <form method="post" action="/login" accept-charset="UTF-8">
      <input type="text" name="username" placeholder="帳號" required><br>
      <input type="password" name="password" placeholder="密碼" required><br>
      <button type="submit">登入</button>
    </form>

    <div class="footer">© 2025 WeShareAI 教育服務</div>
  </div>
</body>
</html>
