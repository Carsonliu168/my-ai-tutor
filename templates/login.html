<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>登入｜數學小老師安安</title>
  <style>
    body{font-family:"Microsoft JhengHei",Arial,sans-serif;background:#f7fbff;display:flex;align-items:center;justify-content:center;height:100vh;margin:0}
    .card{background:#fff;border-radius:14px;box-shadow:0 8px 24px rgba(0,0,0,.08);width:360px;padding:22px}
    h1{margin:0 0 10px 0}
    label{display:block;margin-top:10px}
    input{width:100%;padding:10px 12px;border:1px solid #cfd9e6;border-radius:8px;margin-top:6px}
    button{width:100%;margin-top:16px;padding:10px 12px;border:0;border-radius:10px;background:#4c8bf5;color:#fff;cursor:pointer}
    .err{color:#d33;margin-top:8px}
    .hint{font-size:12px;color:#607089;margin-top:10px}
  </style>
</head>
<body>
  <div class="card">
    <h1>登入安安</h1>
    <form method="post">
      <label>帳號 <input type="text" name="username" autocomplete="username" required></label>
      <label>密碼 <input type="password" name="password" autocomplete="current-password" required></label>
      <button type="submit">登入</button>
      {% if error %}<div class="err">{{ error }}</div>{% endif %}
      <div class="hint">請向管理員索取帳號密碼。</div>
    </form>
  </div>
</body>
</html>
