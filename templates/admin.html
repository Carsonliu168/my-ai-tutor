<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>後台管理｜安安老師</title>
  <style>
    body {
      font-family: "Microsoft JhengHei", sans-serif;
      background: #f8f8ff;
      margin: 0;
      padding: 20px;
    }
    h1 {
      text-align: center;
      color: #ff6699;
      margin-bottom: 30px;
    }
    table {
      border-collapse: collapse;
      width: 100%;
      margin-bottom: 40px;
    }
    th, td {
      border: 1px solid #ddd;
      padding: 8px;
      text-align: left;
    }
    th {
      background: #ffb6c1;
      color: white;
    }
    tr:nth-child(even) { background: #f9f9f9; }
    .logout {
      display: inline-block;
      background: #ffb6c1;
      color: white;
      padding: 8px 15px;
      border-radius: 8px;
      text-decoration: none;
    }
  </style>
</head>
<body>
  <h1>🧮 安安系統管理後台</h1>
  <div style="text-align:right; margin-bottom:10px;">
    <a href="/logout" class="logout">登出</a>
  </div>

  <h2>👥 使用者帳號</h2>
  <table>
    <tr><th>帳號</th><th>角色</th><th>建立時間</th></tr>
    {% for u in users %}
      <tr><td>{{ u[0] }}</td><td>{{ u[1] }}</td><td>{{ u[2] }}</td></tr>
    {% endfor %}
  </table>

  <h2>🧾 最近學習紀錄（最新50筆）</h2>
  <table>
    <tr><th>使用者</th><th>問題</th><th>時間</th></tr>
    {% for r in records %}
      <tr><td>{{ r[0] }}</td><td>{{ r[1] }}</td><td>{{ r[2] }}</td></tr>
    {% endfor %}
  </table>
</body>
</html>
