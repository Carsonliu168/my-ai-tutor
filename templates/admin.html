<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>後台｜解題小幫手</title>
  <style>
    body{font-family:"Microsoft JhengHei",Arial,sans-serif;max-width:1000px;margin:0 auto;padding:20px;background:#f7fbff}
    h1{margin-top:0}
    table{width:100%;border-collapse:collapse;background:#fff;border-radius:12px;overflow:hidden;box-shadow:0 6px 20px rgba(0,0,0,.06)}
    th,td{padding:10px;border-bottom:1px solid #eef2f7;text-align:left;font-size:14px}
    th{background:#eef4ff}
  </style>
</head>
<body>
  <h1>管理後台</h1>
  <p><a href="/">← 返回首頁</a></p>
  <h2>使用者</h2>
  <table>
    <tr><th>帳號</th><th>角色</th><th>建立時間</th></tr>
    {% for u in users %}
    <tr><td>{{u[0]}}</td><td>{{u[1]}}</td><td>{{u[2]}}</td></tr>
    {% endfor %}
  </table>
  <h2>最新紀錄（50）</h2>
  <table>
    <tr><th>帳號</th><th>問題/作答</th><th>時間</th></tr>
    {% for r in records %}
    <tr><td>{{r[0]}}</td><td>{{r[1]}}</td><td>{{r[2]}}</td></tr>
    {% endfor %}
  </table>
</body>
</html>
