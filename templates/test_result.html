<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>🧠 測驗結果｜大腦探險家</title>
  <style>
    body {
      font-family: "Microsoft JhengHei", sans-serif;
      background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
      text-align: center;
      padding: 60px 20px;
      margin: 0;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
    }
    .card {
      background: white;
      padding: 40px 60px;
      border-radius: 20px;
      box-shadow: 0 8px 25px rgba(0,0,0,0.15);
      max-width: 600px;
      width: 100%;
    }
    h1 {
      color: #2c3e50;
      margin-bottom: 20px;
      font-size: 28px;
    }
    h2 {
      color: #ff6699;
      margin-top: 0;
      font-size: 24px;
    }
    p {
      font-size: 18px;
      color: #333;
      line-height: 1.6;
    }
    a {
      display: inline-block;
      margin-top: 30px;
      text-decoration: none;
      background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
      color: #fff;
      padding: 12px 30px;
      border-radius: 10px;
      font-size: 18px;
      transition: transform 0.2s;
    }
    a:hover { transform: translateY(-2px); }
    footer {
      text-align: center;
      color: #eee;
      font-size: 14px;
      margin-top: 40px;
      line-height: 1.4;
    }
  </style>
</head>
<body>
  <div class="card">
    <h1>🧠 測驗完成！</h1>
    <h2>{{ result }}</h2>
    <p>{{ description }}</p>
    <a href="/">回到安安主頁開始學習</a>
  </div>

  <footer>
    🧮 數學小老師安安 v5.0.22 ｜ © 2025 WeShareAI  
    <div>登入狀態：{{ username or '未登入' }} ｜ 角色：{{ role or 'student' }}</div>
  </footer>
</body>
</html>
