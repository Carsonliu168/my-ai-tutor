<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>🧮 數學小老師安安</title>
  <script id="MathJax-script" async src="https://cdn.jsdelivr.net/npm/mathjax@3/es5/tex-mml-chtml.js"></script>

  <style>
    body {
      font-family: "Microsoft JhengHei", Arial, sans-serif;
      background: linear-gradient(135deg, #fff0f5 0%, #e6f3ff 100%);
      margin: 0;
      padding: 0;
      display: flex;
      flex-direction: column;
      min-height: 100vh;
    }
    header {
      text-align: center;
      background: #ffb6c1;
      color: white;
      padding: 20px 10px;
      font-size: 24px;
      font-weight: bold;
      box-shadow: 0 4px 10px rgba(0,0,0,0.1);
    }
    .container {
      flex: 1;
      max-width: 800px;
      margin: 30px auto;
      padding: 20px;
      background: white;
      border-radius: 20px;
      box-shadow: 0 6px 20px rgba(0,0,0,0.1);
    }
    #chat-box {
      height: 480px;
      overflow-y: auto;
      padding: 15px;
      border: 2px solid #f0f0f0;
      border-radius: 10px;
      background: #fafafa;
      margin-bottom: 15px;
    }
    .anan {
      background: #ffe6ec;
      color: #333;
      border-radius: 15px;
      padding: 10px 15px;
      margin: 10px 0;
      max-width: 75%;
      align-self: flex-start;
      box-shadow: 0 2px 6px rgba(255,182,193,0.3);
    }
    .student {
      background: #d7ecff;
      color: #333;
      border-radius: 15px;
      padding: 10px 15px;
      margin: 10px 0;
      max-width: 75%;
      align-self: flex-end;
      box-shadow: 0 2px 6px rgba(102,178,255,0.3);
    }
    form {
      display: flex;
      gap: 10px;
      margin-top: 10px;
    }
    input[type="text"] {
      flex: 1;
      padding: 10px;
      border: 2px solid #ddd;
      border-radius: 10px;
      font-size: 16px;
    }
    button {
      background: #ffb6c1;
      color: white;
      border: none;
      border-radius: 10px;
      padding: 10px 18px;
      font-size: 16px;
      cursor: pointer;
      transition: all 0.2s;
    }
    button:hover { transform: translateY(-2px); }
    #control-buttons {
      display: flex;
      flex-wrap: wrap;
      gap: 10px;
      margin-top: 15px;
    }
    #control-buttons button {
      flex: 1;
      min-width: 100px;
      font-weight: bold;
    }
    #loading-text {
      display: none;
      text-align: center;
      color: #999;
      margin-top: 10px;
    }
    footer {
      text-align: center;
      color: #888;
      font-size: 14px;
      padding: 15px;
      background: #fdfdfd;
      border-top: 1px solid #eee;
      line-height: 1.5;
    }
  </style>
</head>

<body>
  <header>🧮 數學小老師安安</header>

  <div class="container">
    <div id="chat-box"></div>

    <form id="chat-form">
      <input id="user-input" type="text" placeholder="請輸入你的問題..." autocomplete="off" />
      <button type="submit">送出</button>
    </form>

    <div id="control-buttons">
      <button onclick="sendMessage('我懂了')">我懂了</button>
      <button onclick="sendMessage('我不懂')">我不懂</button>
      <button onclick="document.getElementById('image-upload').click()">上傳圖片題</button>
      <button onclick="fetch('/clear').then(()=>location.reload())">清除紀錄</button>
    </div>

    <div id="loading-text">安安正在思考中...</div>
    <input type="file" id="image-upload" accept="image/*" style="display: none;" />
  </div>

  <footer>
    🧮 數學小老師安安 v5.0.22 ｜ © 2025 WeShareAI  
    <div>登入狀態：{{ username or '未登入' }} ｜ 角色：{{ role or 'student' }}</div>
  </footer>

  <script src="/static/script.js"></script>
</body>
</html>
