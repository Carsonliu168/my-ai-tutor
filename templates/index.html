<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>數學小老師安安（無登入還原基線）</title>
  <style>
    * { box-sizing: border-box; }
    body { font-family: "Microsoft JhengHei","Noto Sans TC",Arial,sans-serif; background:#f6f8fb; color:#222; margin:0; }
    .container { max-width: 860px; margin: 40px auto; padding: 0 16px; }
    h1 { margin: 0 0 6px; } .sub { color:#666; margin: 0 0 20px; }
    .card { background:#fff; border-radius:16px; box-shadow:0 6px 20px rgba(0,0,0,.06); padding:16px; margin-bottom:16px; }
    label { display:block; margin-bottom:8px; } textarea { width:100%; padding:10px; border:1px solid #ddd; border-radius:12px; }
    .row { display:flex; align-items:center; gap:12px; margin-top:8px; } select { padding:8px 10px; border:1px solid #ddd; border-radius:12px; }
    button { margin-top:12px; padding:10px 16px; border:none; border-radius:12px; background:#2b6cb0; color:#fff; cursor:pointer; }
    button:hover { filter: brightness(1.05); }
    .reply { white-space:pre-wrap; background:#f8fafc; padding:10px; border-radius:12px; min-height:24px; border:1px dashed #e2e8f0; }
    .footer { display:flex; justify-content:space-between; align-items:center; }
  </style>
</head>
<body>
  <div class="container">
    <h1>✅ 數學小老師安安（無登入還原基線）</h1>
    <p class="sub">三步蘇格拉底教學 · 六種幾何 · π=3.1416 · 圖片上傳 · 自動備援</p>

    <div class="card">
      <label for="message">輸入你的問題（例：「長方形面積怎麼算？」、「圓形周長」）</label>
      <textarea id="message" rows="3" placeholder="請輸入題目或問題…"></textarea>
      <div class="row">
        <label for="step">現在要第幾步？</label>
        <select id="step">
          <option value="1">第 1 步</option>
          <option value="2">第 2 步</option>
          <option value="3">第 3 步</option>
        </select>
      </div>
      <button id="askBtn">送出</button>
    </div>

    <div class="card">
      <h3>回覆</h3>
      <div id="replyBox" class="reply"></div>
    </div>

    <div class="card">
      <h3>圖片分析（AI 備援）</h3>
      <input type="file" id="imgInput" accept="image/*">
      <button id="analyzeBtn">上傳並分析</button>
      <div id="imgReply" class="reply"></div>
    </div>

    <div class="footer">
      <button id="clearBtn">重置</button>
      <span id="version">{{ version }}</span>
    </div>
  </div>

  <script>
    async function chat() {
      const message = document.getElementById('message').value.trim();
      const step = document.getElementById('step').value;
      if (!message) { alert('請先輸入問題'); return; }
      const res = await fetch('/chat', {
        method: 'POST',
        headers: {'Content-Type':'application/json'},
        body: JSON.stringify({message, step})
      });
      const data = await res.json();
      document.getElementById('replyBox').textContent = data.ok ? '🧠 ' + data.reply : '❌ ' + (data.error || '發生錯誤');
    }

    async function analyzeImage() {
      const file = document.getElementById('imgInput').files[0];
      if (!file) { alert('請先選擇圖片'); return; }
      const b64 = await toBase64(file);
      const res = await fetch('/analyze_image', {
        method: 'POST',
        headers: {'Content-Type':'application/json'},
        body: JSON.stringify({ image_base64: b64 })
      });
      const data = await res.json();
      if (!data.ok) {
        document.getElementById('imgReply').textContent = '❌ ' + (data.error || '發生錯誤');
      } else {
        const used = data.provider_used === 'none' ? '（離線示範）' : `（使用：${data.provider_used}）`;
        document.getElementById('imgReply').textContent = '📷 ' + data.reply + ' ' + used;
      }
    }

    async function clearAll() {
      await fetch('/clear', {method:'POST'});
      document.getElementById('message').value='';
      document.getElementById('replyBox').textContent='';
      document.getElementById('imgInput').value='';
      document.getElementById('imgReply').textContent='';
    }

    function toBase64(file) {
      return new Promise((resolve, reject) => {
        const reader = new FileReader();
        reader.onload = () => resolve(reader.result);
        reader.onerror = error => reject(error);
        reader.readAsDataURL(file);
      });
    }

    document.getElementById('askBtn').addEventListener('click', chat);
    document.getElementById('analyzeBtn').addEventListener('click', analyzeImage);
    document.getElementById('clearBtn').addEventListener('click', clearAll);
  </script>
</body>
</html>
