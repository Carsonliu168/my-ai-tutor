<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>🧮 數學小老師安安</title>

  <!-- Markdown -->
  <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>

  <!-- MathJax -->
  <script id="MathJax-script" async
    src="https://cdn.jsdelivr.net/npm/mathjax@3/es5/tex-mml-chtml.js">
  </script>

  <!-- ✅ 加上這兩行（載入 CSS / JS） -->
  <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
  <script defer src="{{ url_for('static', filename='script.js') }}"></script>
</head>

<body>
  <h1>🧮 數學小老師安安</h1>

  <div id="chat-box"></div>

  <div id="input-area">
    <textarea id="user-input" placeholder="輸入你的問題或想問安安的數學題目..."></textarea>

    <div class="button-group">
      <button onclick="sendMessage()">送出</button>
      <button onclick="location.href='/clear'">清除紀錄</button>
      <button onclick="document.getElementById('fileInput').click()">上傳圖片題</button>
      <button onclick="sendMessage('我懂了')">懂了 👍</button>
      <button onclick="sendMessage('我不懂')">不懂 😕</button>
    </div>

    <input type="file" id="fileInput" style="display:none;" accept="image/*" onchange="uploadImage(this)">
  </div>

  <div id="version-tag">v5.0.1-stable ✅</div>
</body>
</html>
