<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>數學小老師安安</title>
  <style>
    body {
      font-family: "Microsoft JhengHei", Arial, sans-serif;
      background: #fff5f7;
      margin: 0;
      padding: 0;
    }
    header {
      background: linear-gradient(180deg, #ffe6ef 0%, #ffddee 100%);
      padding: 20px;
      text-align: center;
      font-size: 28px;
      font-weight: bold;
      color: #d63384;
      border-bottom: 3px solid #ffc0cb;
    }
    header span.icon {
      font-size: 32px;
      margin-right: 8px;
    }
    main {
      padding: 20px;
      max-width: 700px;
      margin: auto;
    }
    .message {
      border-radius: 12px;
      padding: 12px 18px;
      margin-bottom: 12px;
      line-height: 1.6;
      word-wrap: break-word;
    }
    .user {
      background-color: #e7f2ff;
      text-align: left;
      border-left: 6px solid #0078d7;
    }
    .assistant {
      background-color: #ffe6f0;
      text-align: left;
      border-left: 6px solid #ff85a2;
    }
    form {
      margin-top: 25px;
      text-align: center;
    }
    input[type="text"] {
      width: 80%;
      padding: 10px;
      font-size: 16px;
      border-radius: 8px;
      border: 1px solid #ccc;
    }
    button {
      padding: 10px 18px;
      font-size: 16px;
      background-color: #ff7fbf;
      color: white;
      border: none;
      border-radius: 8px;
      cursor: pointer;
      margin-left: 8px;
    }
    button:hover {
      background-color: #ff66a3;
    }
    footer {
      text-align: center;
      margin-top: 30px;
      color: #777;
      font-size: 13px;
    }
  </style>
</head>
<body>
  <header>
    <span class="icon">🧮</span> 數學小老師安安
  </header>

  <main>
    {% for msg in conversation %}
      {% if msg.role == "user" %}
        <div class="message user">👧 你：{{ msg.content }}</div>
      {% else %}
        <div class="message assistant">👩‍🏫 安安老師：{{ msg.content|safe }}</div>
      {% endif %}
    {% endfor %}

    <form method="post" action="/">
      <input type="text" name="message" placeholder="輸入你的問題..." required>
      <button type="submit">送出</button>
    </form>
  </main>

  <footer>
    © 2025 WeShareAI 教育服務｜安安數學助教系統
  </footer>
</body>
</html>
