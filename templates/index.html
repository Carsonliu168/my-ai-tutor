<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>數學小老師安安 v4.5.3</title>
  <style>
    body {
      font-family: "Microsoft JhengHei", Arial, sans-serif;
      background: linear-gradient(135deg, #e0f7fa, #f1f8e9);
      margin: 0;
      padding: 0;
      text-align: center;
    }
    h1 {
      color: #0078d7;
      margin-top: 30px;
    }
    .chat-box {
      width: 90%;
      max-width: 800px;
      margin: 20px auto;
      background: white;
      border-radius: 15px;
      box-shadow: 0 0 20px rgba(0,0,0,0.1);
      padding: 20px;
      text-align: left;
      line-height: 1.6;
    }
    .message {
      margin: 10px 0;
      padding: 10px;
      border-radius: 8px;
    }
    .user {
      background-color: #e3f2fd;
      text-align: right;
    }
    .assistant {
      background-color: #f1f8e9;
    }
    form {
      margin-top: 15px;
    }
    input[type=text] {
      width: 80%;
      padding: 10px;
      border-radius: 8px;
      border: 1px solid #ccc;
      font-size: 16px;
    }
    button {
      padding: 10px 15px;
      margin: 5px;
      border: none;
      border-radius: 8px;
      background-color: #0078d7;
      color: white;
      font-size: 16px;
      cursor: pointer;
    }
    button:hover {
      background-color: #005fa3;
    }
    .feedback-buttons {
      margin-top: 10px;
      text-align: center;
    }
    .feedback-buttons button {
      width: 120px;
    }
    .upload-section {
      margin-top: 20px;
    }
  </style>
</head>
<body>
  <h1>🧮 數學小老師安安</h1>

  <div class="chat-box" id="chatBox">
    {% for msg in conversation %}
      {% if msg.role == 'user' %}
        <div class="message user">👤 你：{{ msg.content }}</div>
      {% else %}
        <div class="message assistant">🤖 安安老師：{{ msg.content|safe }}</div>
      {% endif %}
    {% endfor %}
  </div>

  <form method="post">
    <input type="text" name="message" placeholder="輸入你的問題..." required>
    <button type="submit">送出</button>
    <button type="button" onclick="window.location.href='/clear'">清除紀錄</button>
  </form>

  <div class="upload-section">
    <form id="imgForm" enctype="multipart/form-data">
      <input type="file" name="image" accept="image/*" required>
      <button type="button" onclick="uploadImage()">上傳圖片題 📷</button>
    </form>
    <p id="uploadStatus"></p>
  </div>

  <div class="feedback-buttons">
    <button onclick="sendFeedback(true)">懂了 👍</button>
    <button onclick="sendFeedback(false)">不懂 😵</button>
  </div>

  <script>
    async function uploadImage() {
      const form = document.getElementById("imgForm");
      const formData = new FormData(form);
      document.getElementById("uploadStatus").innerText = "⏳ 分析中...";
      const res = await fetch("/analyze_image", { method: "POST", body: formData });
      const data = await res.json();
      document.getElementById("uploadStatus").innerText = data.result || "❌ 辨識失敗";
      if (data.success) location.reload();
    }

    async function sendFeedback(understood) {
      const res = await fetch("/feedback", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ understood })
      });
      const data = await res.json();
      alert(data.reply);
      if (understood) location.href = "/clear";
    }
  </script>
</body>
</html>
