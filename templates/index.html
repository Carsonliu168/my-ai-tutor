<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>🧮 數學小老師安安</title>
  <script id="MathJax-script" async src="https://cdn.jsdelivr.net/npm/mathjax@3/es5/tex-mml-chtml.js"></script>
  <style>
    body {
      font-family: "Microsoft JhengHei", Arial, sans-serif;
      background: linear-gradient(135deg, #fff0f5 0%, #e6f3ff 100%);
      margin: 0;
      padding: 0;
      display: flex;
      flex-direction: column;
      min-height: 100vh;
    }
    header {
      text-align: center;
      background: linear-gradient(135deg, #ffb6c1 0%, #ff9eaf 100%);
      color: white;
      padding: 20px 10px;
      font-size: 24px;
      font-weight: bold;
      box-shadow: 0 4px 10px rgba(0,0,0,0.15);
    }
    /* 🔧 修正：容器置中且左右對稱 */
    .container {
      flex: 1;
      max-width: 900px;
      width: 100%;
      margin: 30px auto;
      padding: 20px 40px;  /* 左右 padding 一致 */
      background: white;
      border-radius: 20px;
      box-shadow: 0 6px 20px rgba(0,0,0,0.1);
      box-sizing: border-box;  /* 確保 padding 不影響寬度 */
    }
    /* 🔧 修正：聊天框左右對稱 */
    #chat-box {
      height: 480px;
      overflow-y: auto;
      padding: 15px 20px;  /* 左右 padding 一致 */
      border: 2px solid #f0f0f0;
      border-radius: 10px;
      background: #fafafa;
      margin-bottom: 15px;
      display: flex;
      flex-direction: column;
    }
    /* 🎨 安安的訊息泡泡 */
    .anan {
      background: linear-gradient(135deg, #ffe6ec 0%, #ffd4e0 100%);
      color: #333;
      border-radius: 15px 15px 15px 5px;
      padding: 12px 16px;
      margin: 10px 0;
      max-width: 75%;
      align-self: flex-start;
      box-shadow: 0 2px 8px rgba(255,182,193,0.3);
      line-height: 1.6;
    }
    /* 🆕 安安訊息內的列表樣式 */
    .anan ul {
      margin: 10px 0;
      padding-left: 20px;
    }
    .anan li {
      margin: 5px 0;
      list-style-type: disc;
    }
    /* 🎨 學生的訊息泡泡 */
    .student {
      background: linear-gradient(135deg, #d7ecff 0%, #c4e0ff 100%);
      color: #333;
      border-radius: 15px 15px 5px 15px;
      padding: 12px 16px;
      margin: 10px 0;
      max-width: 75%;
      align-self: flex-end;
      box-shadow: 0 2px 8px rgba(102,178,255,0.3);
      line-height: 1.6;
    }
    /* 🔧 表單對齊 */
    form {
      display: flex;
      gap: 10px;
      margin-top: 10px;
    }
    input[type="text"] {
      flex: 1;
      padding: 12px 15px;
      border: 2px solid #e0e0e0;
      border-radius: 10px;
      font-size: 16px;
      transition: border-color 0.2s;
    }
    input[type="text"]:focus {
      outline: none;
      border-color: #ffb6c1;
    }
    /* 🎨 按鈕基礎樣式 */
    button {
      color: white;
      border: none;
      border-radius: 10px;
      padding: 12px 20px;
      font-size: 16px;
      font-weight: bold;
      cursor: pointer;
      transition: all 0.3s;
      box-shadow: 0 2px 6px rgba(0,0,0,0.1);
    }
    button:hover { 
      transform: translateY(-2px);
      box-shadow: 0 4px 10px rgba(0,0,0,0.15);
    }
    button:active {
      transform: translateY(0);
    }
    /* 🎨 送出按鈕（主要動作） */
    button[type="submit"] {
      background: linear-gradient(135deg, #ff9eaf 0%, #ff7a93 100%);
    }
    button[type="submit"]:hover {
      background: linear-gradient(135deg, #ff7a93 0%, #ff5577 100%);
    }
    /* 🎨 控制按鈕區 */
    #control-buttons {
      display: flex;
      flex-wrap: wrap;
      gap: 10px;
      margin-top: 15px;
    }
    #control-buttons button {
      flex: 1;
      min-width: 120px;
      font-weight: bold;
    }
    /* 🎨 我懂了（正面 - 綠色） */
    #control-buttons button:nth-child(1) {
      background: linear-gradient(135deg, #81c784 0%, #66bb6a 100%);
    }
    #control-buttons button:nth-child(1):hover {
      background: linear-gradient(135deg, #66bb6a 0%, #4caf50 100%);
    }
    /* 🎨 我不懂（警示 - 橘色） */
    #control-buttons button:nth-child(2) {
      background: linear-gradient(135deg, #ffb74d 0%, #ffa726 100%);
    }
    #control-buttons button:nth-child(2):hover {
      background: linear-gradient(135deg, #ffa726 0%, #ff9800 100%);
    }
    /* 🎨 上傳圖片題（功能 - 藍色） */
    #control-buttons button:nth-child(3) {
      background: linear-gradient(135deg, #64b5f6 0%, #42a5f5 100%);
    }
    #control-buttons button:nth-child(3):hover {
      background: linear-gradient(135deg, #42a5f5 0%, #2196f3 100%);
    }
    /* 🎨 清除紀錄（次要 - 灰色） */
    #control-buttons button:nth-child(4) {
      background: linear-gradient(135deg, #bdbdbd 0%, #9e9e9e 100%);
    }
    #control-buttons button:nth-child(4):hover {
      background: linear-gradient(135deg, #9e9e9e 0%, #757575 100%);
    }
    /* 載入提示 */
    #loading-text {
      display: none;
      text-align: center;
      color: #999;
      margin-top: 10px;
      font-size: 14px;
    }
    /* Footer */
    footer {
      text-align: center;
      color: #888;
      font-size: 14px;
      padding: 15px;
      background: #fdfdfd;
      border-top: 1px solid #eee;
      line-height: 1.5;
    }
    /* 🆕 響應式設計 */
    @media (max-width: 768px) {
      .container {
        margin: 15px;
        padding: 15px 20px;
      }
      #chat-box {
        height: 400px;
      }
      #control-buttons button {
        min-width: 100px;
        font-size: 14px;
      }
    }
  </style>
</head>
<body>
  <header>🧮 數學小老師安安</header>
  <div class="container">
    <div id="chat-box"></div>
    <form id="chat-form">
      <input id="user-input" type="text" placeholder="請輸入你的問題..." autocomplete="off" />
      <button type="submit">送出</button>
    </form>
    <div id="control-buttons">
      <button onclick="sendMessage('我懂了')">我懂了</button>
      <button onclick="sendMessage('我不懂')">我不懂</button>
      <button onclick="document.getElementById('image-upload').click()">上傳圖片題</button>
      <button onclick="fetch('/clear').then(()=>location.reload())">清除紀錄</button>
    </div>
    <div id="loading-text">安安正在思考中...</div>
    <input type="file" id="image-upload" accept="image/*" style="display: none;" />
  </div>
  <footer>
    🧮 數學小老師安安 v5.4.1 ｜ © 2025 WeShareAI  
    <div>登入狀態：{{ username or '未登入' }} ｜ 角色：{{ role or 'student' }}</div>
  </footer>
  <script src="/static/script.js?v=541"></script>
</body>
</html>
