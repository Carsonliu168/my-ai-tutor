<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>數學小老師安安 v4.7-login-ui</title>
  <style>
    body {
      font-family: "Microsoft JhengHei", Arial, sans-serif;
      background: linear-gradient(120deg, #e0f7fa, #e3f2fd);
      margin: 0;
      padding: 0;
      display: flex;
      flex-direction: column;
      align-items: center;
      min-height: 100vh;
    }
    h1 {
      margin-top: 30px;
      color: #0078d7;
    }
    .chat-box {
      width: 90%;
      max-width: 800px;
      background: white;
      padding: 20px;
      margin-top: 20px;
      border-radius: 15px;
      box-shadow: 0 0 15px rgba(0,0,0,0.1);
      overflow-y: auto;
    }
    .message {
      margin: 10px 0;
      padding: 10px;
      border-radius: 10px;
      line-height: 1.6;
    }
    .user {
      background: #e8f0fe;
      text-align: right;
    }
    .assistant {
      background: #f1f8e9;
      text-align: left;
    }
    form {
      margin-top: 20px;
      display: flex;
      flex-direction: column;
      align-items: center;
      width: 90%;
      max-width: 800px;
    }
    input[type=text] {
      width: 100%;
      padding: 10px;
      font-size: 16px;
      border-radius: 8px;
      border: 1px solid #ccc;
      margin-bottom: 10px;
    }
    button {
      padding: 10px 20px;
      background-color: #0078d7;
      color: white;
      border: none;
      border-radius: 8px;
      cursor: pointer;
      font-size: 16px;
      margin: 5px;
    }
    button:hover {
      background-color: #005fa3;
    }
    .controls {
      display: flex;
      justify-content: center;
      gap: 10px;
      margin-bottom: 20px;
    }
    .upload-section {
      margin-top: 15px;
      text-align: center;
    }
  </style>
</head>
<body>
  <h1>🧮 數學小老師安安</h1>

  <div class="chat-box" id="chatBox">
    {% for msg in conversation %}
      {% if msg.role == 'user' %}
        <div class="message user">👤 你：{{ msg.content }}</div>
      {% else %}
        <div class="message assistant">🤖 安安老師：{{ msg.content|safe }}</div>
      {% endif %}
    {% endfor %}
  </div>

  <form method="post">
    <input type="text" name="message" placeholder="請輸入你的問題..." required>
    <div class="controls">
      <button type="submit">送出問題</button>
      <button type="button" onclick="clearChat()">清除紀錄</button>
    </div>
  </form>

  <div class="upload-section">
    <form id="imgForm" enctype="multipart/form-data">
      <input type="file" name="image" accept="image/*" required>
      <button type="button" onclick="uploadImage()">上傳圖片題 📷</button>
    </form>
    <p id="uploadStatus"></p>
  </div>

  <script>
    function clearChat() {
      window.location.href = "/clear";
    }

    async function uploadImage() {
      const form = document.getElementById("imgForm");
      const formData = new FormData(form);
      document.getElementById("uploadStatus").innerText = "⏳ 上傳中...";
      const res = await fetch("/analyze_image", { method: "POST", body: formData });
      const data = await res.json();
      document.getElementById("uploadStatus").innerText = data.result || "❌ 上傳失敗";
      if (data.success) location.reload();
    }
  </script>
</body>
</html>
