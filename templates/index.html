<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>數學小老師安安</title>
  <script id="MathJax-script" async src="https://cdn.jsdelivr.net/npm/mathjax@3/es5/tex-mml-chtml.js"></script>

  <style>
    body {
      font-family: "Microsoft JhengHei", Arial, sans-serif;
      max-width: 800px; margin: 0 auto; padding: 20px;
      background: linear-gradient(135deg, #f0f8ff 0%, #e6f3ff 100%);
    }
    .header { text-align: center; background: #fff9; padding: 20px; border-radius: 15px; box-shadow: 0 4px 6px #0001; }
    .header h1 { color: #e74c3c; }
    .chat-container { background: #fff9; border: 2px solid #dee2e6; border-radius: 15px; padding: 20px; height: 500px; overflow-y: auto; box-shadow: 0 6px 12px #0001; margin: 20px 0; }
    .message { margin: 15px 0; max-width: 80%; padding: 12px 18px; border-radius: 18px; box-shadow: 0 2px 4px #0001; animation: fadeIn .3s ease-out; }
    @keyframes fadeIn { from {opacity:0; transform:translateY(10px);} to {opacity:1; transform:translateY(0);} }
    .user { background: linear-gradient(135deg,#4facfe 0%,#00f2fe 100%); color:#fff; margin-left:auto; }
    .assistant { background: linear-gradient(135deg,#ffecd2 0%,#fcb69f 100%); color:#6b3a00; margin-right:auto; }
    .assistant.encouragement { background: linear-gradient(135deg,#b2f2bb 0%,#74c69d 100%); color:#14532d; }
    .assistant.explanation { background: linear-gradient(135deg,#ffe6b3 0%,#ffbb99 100%); color:#7a3e00; }
    .message-header { font-weight: bold; margin-bottom: 8px; font-size: .9em; opacity: .8; }
    .message-content { white-space: pre-wrap; word-wrap: break-word; font-size: 1.1em; }
    .input-area { display:flex; gap:12px; background:#fff9; padding:15px; border-radius:15px; box-shadow:0 4px 6px #0001; }
    input[type=text]{ flex:1; padding:15px; border:2px solid #e3f2fd; border-radius:25px; font-size:16px; }
    button { padding:15px 30px; border:none; border-radius:25px; color:#fff; font-weight:bold; cursor:pointer;
             background:linear-gradient(135deg,#667eea 0%,#764ba2 100%); transition:.2s; }
    button:hover{ transform:translateY(-2px); box-shadow:0 4px 8px #0002; }
    .upload-area{text-align:center;margin:20px 0;}
    .upload-btn{padding:12px 25px;border:none;border-radius:25px;cursor:pointer;font-weight:bold;
                background:linear-gradient(135deg,#ff9a9e 0%,#fecfef 100%);color:#fff;}
    .loading{text-align:center;color:#667eea;font-weight:bold;margin:10px 0;display:none;}
    .preview img{max-width:300px;border-radius:10px;box-shadow:0 4px 8px #0002;}
    .controls{text-align:center;margin-top:15px;}
    .controls a{color:#667eea;text-decoration:none;font-weight:bold;}
    .controls a:hover{text-decoration:underline;}
    #feedback{text-align:center;margin:15px 0 10px;}
    #feedback button{padding:10px 18px;margin:0 5px;border:none;border-radius:10px;color:#fff;font-weight:bold;cursor:pointer;}
    #btn-understood{background:linear-gradient(135deg,#4caf50 0%,#81c784 100%);}
    #btn-confused{background:linear-gradient(135deg,#f44336 0%,#e57373 100%);}
  </style>
</head>

<body>
  <div class="header">
    <h1>數學小老師安安</h1>
    <p>讓數學變得簡單又有趣 ✨</p>
  </div>

  <div id="chatContainer" class="chat-container">
    {% for msg in conversation %}
    <div class="message {{ 'user' if msg.role == 'user' else 'assistant' }}">
      <div class="message-header">{{ '你' if msg.role == 'user' else '安安老師' }}：</div>
      <div class="message-content">{{ msg.content|safe }}</div>
    </div>
    {% endfor %}
    <div id="thinking" class="loading">🧠 安安老師正在思考中...</div>
  </div>

  <div class="upload-area">
    <input type="file" id="imageInput" accept="image/*" style="display:none;">
    <button class="upload-btn" onclick="document.getElementById('imageInput').click();">📷 上傳數學題目圖片</button>
    <div class="preview" id="previewArea"><img id="previewImage" alt="圖片預覽"></div>
  </div>

  <form method="POST" id="textForm">
    <div class="input-area">
      <input type="text" name="message" placeholder="請輸入數學問題 😊" required
             onkeydown="if(event.key==='Enter'){event.preventDefault();this.form.submit();}">
      <button type="submit">✨ 問安安</button>
    </div>
  </form>

  <div id="feedback">
    <button id="btn-understood" onclick="sendFeedback(true)">👍 我懂了</button>
    <button id="btn-confused" onclick="sendFeedback(false)">❓ 我不懂</button>
  </div>

  <div class="controls">
    <a href="/clear" onclick="return confirm('確定要清除所有對話嗎？')">🗑️ 清除對話</a>
  </div>

  <script>
    const chat = document.getElementById("chatContainer");
    const thinkingEl = document.getElementById("thinking");
    const imageInput = document.getElementById("imageInput");
    const previewArea = document.getElementById("previewArea");
    const previewImage = document.getElementById("previewImage");

    function scrollToBottom(){ chat.scrollTop = chat.scrollHeight; }

    document.getElementById("textForm").addEventListener("submit",()=>{
      thinkingEl.style.display="block"; scrollToBottom();
    });

    // 上傳圖片
    imageInput.addEventListener("change", async (e)=>{
      const file = e.target.files[0];
      if(!file) return;
      previewImage.src = URL.createObjectURL(file);
      previewArea.style.display = "block";
      thinkingEl.textContent = "🔍 安安老師正在仔細看圖片，請稍候 5 秒鐘喔～";
      thinkingEl.style.display = "block"; scrollToBottom();

      const fd = new FormData(); fd.append("image", file);
      try{
        const res = await fetch("/analyze_image",{method:"POST",body:fd});
        const data = await res.json();
        thinkingEl.style.display="none";
        addMessage("assistant", data.result || "⚠️ 無回應");
      }catch{
        thinkingEl.style.display="none";
        addMessage("assistant","⚠️ 圖片上傳或辨識失敗，請重試！");
      }
    });

    function addMessage(role,text,type=""){
      const div=document.createElement("div");
      div.className=`message ${role}`; if(type)div.classList.add(type);
      div.innerHTML=`<div class="message-header">${role==="user"?"你":"安安老師"}：</div>
                     <div class="message-content">${text}</div>`;
      chat.appendChild(div);
      if(window.MathJax&&window.MathJax.typesetPromise) MathJax.typesetPromise();
      scrollToBottom();
    }

    async function sendFeedback(understood){
      try{
        const res=await fetch("/feedback",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({understood})});
        const data=await res.json();
        const msg=data.reply||(understood?"太棒了～安安替你開心 💪":"沒關係，我們再一起想想吧 💭");
        const type=understood?"encouragement":"explanation";
        addMessage("assistant",msg,type);
      }catch{ alert("⚠️ 回饋失敗，請稍後再試。"); }
    }

    scrollToBottom();
  </script>
</body>
</html>
